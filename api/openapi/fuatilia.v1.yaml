  # ===========================================================================
  # /v1/payments — routes/payments.ts
  #   intake/confirmations → payments:intake; read → payments:read;
  #   refund-reservations → payments:refund
  # ===========================================================================

  /v1/payments/intake:
    post:
      tags: [Payments]
      operationId: intakePayment
      summary: The ONE intake funnel for Daraja money (C2B + STK).
      description: >
        Requires `payments:intake`. At-least-once channel semantics (R9/C5):
        replays are NORMAL and idempotent — a duplicate `(channel,
        externalRef)` or `idempotencyKey` answers **200** with the EXISTING
        payment and `duplicate: true` (the lane records a
        `payments.duplicateCallbackObserved` tripwire), never a second
        Payment. A duplicate carrying a DIFFERENT amount → 409
        `DUPLICATE_AMOUNT_MISMATCH` (untrusted input, not a benign retry);
        a duplicate in a different currency → 409 `CURRENCY_MISMATCH`.
        Routing note: the literal `/v1/payments/intake` row wins for POST;
        `GET /v1/payments/intake` resolves against
        `/v1/payments/{paymentId}` and 404s (`HTTP_PAYMENT_NOT_FOUND`).
      x-required-permission: payments:intake
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IntakeBody'}
            example:
              channel: c2b
              externalRef: SBK41XQ7RT
              idempotencyKey: daraja-c2b-SBK41XQ7RT
              amount: {minor: 750000, currency: KES}
              customerId: 11a2b3c4-d5e6-4789-8a0b-1c2d3e4f5a6b
              declaredRefs: [INV-2026-08-0001]
      responses:
        '201':
          description: 'Payment initiated (`state: initiated`).'
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentIntakeResponse'}
              example:
                data:
                  payment:
                    id: 8d9e0f1a-2b3c-4d5e-8f6a-7b8c9d0e1f2a
                    channel: c2b
                    externalRef: SBK41XQ7RT
                    idempotencyKey: daraja-c2b-SBK41XQ7RT
                    customerId: 11a2b3c4-d5e6-4789-8a0b-1c2d3e4f5a6b
                    state: initiated
                    currency: KES
                    requested: {minor: 750000, currency: KES}
                    confirmed: null
                    unapplied: {minor: 0, currency: KES}
                    declaredRefs: [INV-2026-08-0001]
                    allocations: []
                    refunds: []
                    initiatedAt: '2026-09-04T10:00:00.000Z'
                    confirmedAt: null
                    failedAt: null
                    failureCode: null
                    reversedAt: null
                    reversalReason: null
                  duplicate: false
        '200':
          description: >
            Idempotent replay of a known callback — the EXISTING payment with
            `duplicate: true` (R9/C5).
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentIntakeResponse'}
        '400': {$ref: '#/components/responses/BodyInvalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '409':
          description: >
            Tampered duplicate — same transaction id but different money:
            `DUPLICATE_AMOUNT_MISMATCH` (amount) or `CURRENCY_MISMATCH`
            (currency, R10).
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example:
                error:
                  code: DUPLICATE_AMOUNT_MISMATCH
                  message: duplicate callback for SBK41XQ7RT carries KES 7,500.01 but the payment was initiated for KES 7,500.00
                requestId: 9f2c1b3a-4d5e-4f60-8a71-2b3c4d5e6f70
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '500': {$ref: '#/components/responses/InternalError'}

  /v1/payments/{paymentId}/confirmations:
    post:
      tags: [Payments]
      operationId: confirmPayment
      summary: The Daraja success callback (idempotent confirmation).
      description: >
        Requires `payments:intake`. Sets `confirmedMinor` exactly ONCE.
        Idempotent by value: a re-confirmed success callback with the SAME
        amount answers **200** `alreadyConfirmed: true`; a DIFFERENT amount
        → 409 `CONFIRMED_AMOUNT_MISMATCH`. The adapter advances an
        `initiated` payment through the lane's own `awaitConfirmation`
        transition first, so callbacks may race ahead of the platform's
        awaiting-confirmation step. Terminal payments refuse with 409
        `PAYMENT_TERMINAL`; illegal states answer 409 `INVALID_TRANSITION`;
        cross-currency amounts answer 409 `CURRENCY_MISMATCH`.
      x-required-permission: payments:intake
      parameters:
        - {$ref: '#/components/parameters/PaymentId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfirmationBody'}
            example:
              amount: {minor: 750000, currency: KES}
      responses:
        '201':
          description: 'Payment confirmed (`state: confirmed`).'
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentConfirmationResponse'}
              example:
                data:
                  payment:
                    id: 8d9e0f1a-2b3c-4d5e-8f6a-7b8c9d0e1f2a
                    channel: c2b
                    externalRef: SBK41XQ7RT
                    idempotencyKey: daraja-c2b-SBK41XQ7RT
                    customerId: 11a2b3c4-d5e6-4789-8a0b-1c2d3e4f5a6b
                    state: confirmed
                    currency: KES
                    requested: {minor: 750000, currency: KES}
                    confirmed: {minor: 750000, currency: KES}
                    unapplied: {minor: 750000, currency: KES}
                    declaredRefs: [INV-2026-08-0001]
                    allocations: []
                    refunds: []
                    initiatedAt: '2026-09-04T10:00:00.000Z'
                    confirmedAt: '2026-09-04T10:01:30.000Z'
                    failedAt: null
                    failureCode: null
                    reversedAt: null
                    reversalReason: null
                  alreadyConfirmed: false
        '200':
          description: >
            Replay of the same success callback — no-op, `alreadyConfirmed:
            true` (the same amount must mean the same money).
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentConfirmationResponse'}
        '400': {$ref: '#/components/responses/BodyInvalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404':
          description: No payment carries the id (`HTTP_PAYMENT_NOT_FOUND`).
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example:
                error:
                  code: HTTP_PAYMENT_NOT_FOUND
                  message: payment 8d9e0f1a-2b3c-4d5e-8f6a-7b8c9d0e1f2a does not exist
                requestId: 9f2c1b3a-4d5e-4f60-8a71-2b3c4d5e6f70
        '409':
          description: >
            State conflicts — `CONFIRMED_AMOUNT_MISMATCH` (re-confirm with a
            different amount), `PAYMENT_TERMINAL` (failed/reversed/refunded),
            `INVALID_TRANSITION`, `CURRENCY_MISMATCH`.
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example:
                error:
                  code: CONFIRMED_AMOUNT_MISMATCH
                  message: payment 8d9e0f1a-2b3c-4d5e-8f6a-7b8c9d0e1f2a already confirmed for 750000, cannot re-confirm for 800000
                requestId: 9f2c1b3a-4d5e-4f60-8a71-2b3c4d5e6f70
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '500': {$ref: '#/components/responses/InternalError'}

  /v1/payments/{paymentId}/refund-reservations:
    post:
      tags: [Payments]
      operationId: recordRefundReservation
      summary: Reserve a refund against confirmed funds (R6 ceiling).
      description: >
        Requires `payments:refund`. Appends an append-only refund reservation
        row and enforces the payment side of R6: refunds draw ONLY on funds
        not already allocated/refunded — over-draw → 422
        `REFUND_EXCEEDS_AVAILABLE`. Refunds on money that has not landed →
        409 `PAYMENT_NOT_CONFIRMED`; terminal payments → 409
        `PAYMENT_TERMINAL`; cross-currency → 409 `CURRENCY_MISMATCH`.
      x-required-permission: payments:refund
      parameters:
        - {$ref: '#/components/parameters/PaymentId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefundReservationBody'}
            example:
              amount: {minor: 250000, currency: KES}
              reason: duplicate deposit — refunding the overpayment
      responses:
        '201':
          description: Reservation recorded; the view shows the appended refund row.
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentRefundResponse'}
              example:
                data:
                  payment:
                    id: 8d9e0f1a-2b3c-4d5e-8f6a-7b8c9d0e1f2a
                    channel: c2b
                    externalRef: SBK41XQ7RT
                    idempotencyKey: daraja-c2b-SBK41XQ7RT
                    customerId: 11a2b3c4-d5e6-4789-8a0b-1c2d3e4f5a6b
                    state: confirmed
                    currency: KES
                    requested: {minor: 750000, currency: KES}
                    confirmed: {minor: 750000, currency: KES}
                    unapplied: {minor: 500000, currency: KES}
                    declaredRefs: [INV-2026-08-0001]
                    allocations: []
                    refunds:
                      - id: 9a8b7c6d-5e4f-4321-8ab0-998877665544
                        amount: {minor: 250000, currency: KES}
                        reason: duplicate deposit — refunding the overpayment
                        recordedAt: '2026-09-04T10:05:00.000Z'
                    initiatedAt: '2026-09-04T10:00:00.000Z'
                    confirmedAt: '2026-09-04T10:01:30.000Z'
                    failedAt: null
                    failureCode: null
                    reversedAt: null
                    reversalReason: null
        '400': {$ref: '#/components/responses/BodyInvalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404':
          description: No payment carries the id (`HTTP_PAYMENT_NOT_FOUND`).
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: >
            Refunds draw on confirmed funds only — `PAYMENT_NOT_CONFIRMED`
            (money not landed) or `PAYMENT_TERMINAL` / `CURRENCY_MISMATCH`.
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example:
                error:
                  code: PAYMENT_NOT_CONFIRMED
                  message: refunds draw on confirmed funds; payment 8d9e0f1a-2b3c-4d5e-8f6a-7b8c9d0e1f2a is initiated (R6)
                requestId: 9f2c1b3a-4d5e-4f60-8a71-2b3c4d5e6f70
        '422':
          description: >
            The R6 ceiling refused the draw — allocations + refunds would
