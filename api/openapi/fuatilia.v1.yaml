        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404':
          description: >
            A covered receivable does not exist (`HTTP_RECEIVABLE_NOT_FOUND`
            — the lane treats ids as opaque; the boundary checks referential
            integrity).
          headers:
