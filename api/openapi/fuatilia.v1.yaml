# =============================================================================
# FuatiliA — /v1 machine-readable contract (issue #67, wave 9 "Production W1")
# =============================================================================
# Documents EXACTLY what is mounted today on the HTTP kernel
# (src/adapters/http/ — issues #55/#60). NOTHING here is aspirational:
# every path/method below is a row in a real route table
# (routes/public.ts, routes/auth.ts, routes/receivables.ts,
# routes/payments.ts, routes/collections.ts — 22 operations over 21 paths).
#
# Wire rules derived from kernel/kernel.ts (do not guess, read the source):
#   - Every response carries `x-request-id` (echoed from the request's
#     x-request-id / x-correlation-id header, else generated).
#   - Success envelope: `{ "data": <payload>, "meta"?: <object> }`.
#   - Error envelope:   `{ "error": { "code": SCREAMING_SNAKE, "message" }, "requestId" }`.
#   - Unmapped/internal failures fail CLOSED to 500 HTTP_INTERNAL_ERROR with a
#     generic "internal server error" message — internals never leak.
# =============================================================================
openapi: 3.1.0
info:
  title: Fuatilia API
  version: 1.0.0
  summary: AR/collections platform for Kenya — the mounted /v1 JSON surface.
  description: |
    The versioned JSON surface of the FuatiliA AR/collections platform,
    served by the deterministic HTTP kernel (`src/adapters/http/`).

    **Envelope.** Successes are `{ "data": ..., "meta"?: ... }` (meta appears
    on paginated lists as `meta.pagination`). Failures are
    `{ "error": { "code", "message" }, "requestId" }` where `code` is a stable
    SCREAMING_SNAKE_CASE code — clients branch on codes, never on prose.

    **Authentication.** Protected operations accept EITHER credential:

    * `Authorization: Bearer <sessionToken>` — an auth-lane session id;
    * `Authorization: ApiKey <keyId>.<secret>` — split at the FIRST dot.

    Public operations (`GET /v1/health`, `GET /v1/meta`) never attempt
    authentication. Deny-by-default is audited: every 401/403 refusal is
    recorded as an `auth.accessDenied` fact upstream; no secret material is
    ever echoed back.

    **401 vs 403.** `401` = no/malformed header or the lane refused the
    credential — the auth lane's stable denial code passes through
    (`KEY_UNKNOWN`, `KEY_SECRET_MISMATCH`, `KEY_REVOKED`, `KEY_EXPIRED`,
    `KEY_OWNER_INACTIVE`, `PRINCIPAL_UNKNOWN`, `SESSION_IDLE_EXPIRED`,
    `SESSION_ABSOLUTE_EXPIRED`, `SESSION_REVOKED`, `SESSION_ENDED`, …).
    `403` = authenticated but not authorized — `AUTH_ACCESS_DENIED` (the
    message IS the guard's denial detail, e.g. "no active grant or scope
    covers 'payments:read' — deny by default"), or the domain blockers
    `AUTH_ESCALATION_BLOCKED` (role grants) and `DUNNING_CONSENT_REQUIRED`
    (automated outbound dunning without consent).

    **Routing.** `/v1`-prefixed, case-sensitive, one optional trailing slash.
    Unknown path → 404 `HTTP_ROUTE_NOT_FOUND`; known path with the wrong
    method → 405 `HTTP_METHOD_NOT_ALLOWED` + an `allow` header. Request JSON
    bodies are capped (default 1 MiB) — over-limit → 413
    `HTTP_PAYLOAD_TOO_LARGE`; non-JSON → 400 `HTTP_BODY_MALFORMED`. Any
    handler-level internal failure → 500 `HTTP_INTERNAL_ERROR` (generic).

    **Pagination.** List operations take `limit` (integer 1–100, default 20 —
    boundaries are STRICT, the kernel never clamps), an opaque `cursor`
    (reference implementation: offset into the deterministic order) and
    `sort`/`order` against a per-resource whitelist. Violations answer 400
    `HTTP_QUERY_INVALID`. Page metadata rides in `meta.pagination`
    (`nextCursor` + `total`).
  license:
    name: MIT
    url: https://github.com/Roy-Wanyoike/fuatilia/blob/main/LICENSE
servers:
  - url: http://localhost:3000
    description: >
      Local composition example. The reference kernel binds an EPHEMERAL port
      in tests (`server.ts` `listen(port=0)`); no production URL is deployed
      yet, so this entry documents the shape of a base URL, not a real host.
tags:
  - name: Health
    description: Public liveness + capability discovery.
  - name: Auth Admin
    description: >
      User / role-grant / api-key / session administration over the auth lane.
      Every operation requires the `admin:manage-users` vocabulary permission.
  - name: Receivables
    description: >
      The receivable read model (aging + balances). Read-only this wave —
      rows arrive through the invoicing flow / persistence adapters.
  - name: Payments
    description: >
      The fund-truth surface: the ONE Daraja at-least-once intake funnel
      (C2B + STK), lookup/list and the refund-reservation lifecycle (R6).
  - name: Collections
    description: >
      Collections cases: open / transition / escalate / record action /
      complete action, plus the org-scoped case read model (R8 exclusivity,
      K2 dunning consent).

# Root security: protected operations accept Bearer session OR ApiKey.
# Public operations override with `security: []`.
security:
  - bearerSession: []
  - apiKeyAuth: []

paths:

  # ===========================================================================
  # Public (no-auth) routes — routes/public.ts
  # ===========================================================================

  /v1/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness probe.
      description: >
        Public. The kernel never attempts authentication on rows without a
        permission (`ctx.principal` stays null). Answers the plain success
        envelope with the service's liveness verdict.
      security: []
      x-required-permission: null
      responses:
        '200':
          description: The service is alive.
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthResponse'}
              example:
                data:
                  status: ok

  /v1/meta:
    get:
      tags: [Health]
      operationId: getMeta
      summary: Service name, API version and the mounted capability list.
      description: >
        Public. `capabilities` is DERIVED from the route table at composition
        (the third `/v1/<segment>` of every mounted pattern, sorted, unique) —
        later waves that mount more resources surface here without code
        changes. Today: `["auth", "collections", "payments", "receivables"]`.
      security: []
      x-required-permission: null
      responses:
        '200':
          description: The capability list for this deployment.
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MetaResponse'}
              example:
                data:
                  name: fuatilia
                  apiVersion: v1
                  capabilities: [auth, collections, payments, receivables]

  # ===========================================================================
  # /v1/auth/* admin table — routes/auth.ts (permission: admin:manage-users)
  # ===========================================================================

  /v1/auth/users:
    post:
      tags: [Auth Admin]
      operationId: createUser
      summary: Create a user in the caller's org.
      description: >
        Requires `admin:manage-users`. The new user is scoped to the
        authenticated principal's org (`principal.orgId`); the wire handler
        validates the body shape (400 `HTTP_BODY_INVALID`), then the auth
        lane re-validates values (`AUTH_EMAIL_MALFORMED` → 400,
        `AUTH_EMAIL_TAKEN` / `AUTH_USERNAME_TAKEN` → 409). Emits the lane's
        `auth.userCreated` fact.
      x-required-permission: admin:manage-users
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateUserBody'}
            example:
              email: mary.wanjiku@mjengo.co.ke
              username: mwanjiku
              displayName: Mary Wanjiku
      responses:
        '201':
          description: User created.
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserCreatedResponse'}
              example:
                data:
                  user:
                    id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                    orgId: 00000000-0000-4000-8000-000000000901
                    email: mary.wanjiku@mjengo.co.ke
                    username: mwanjiku
                    displayName: Mary Wanjiku
                    status: active
                    createdAt: '2026-09-04T09:15:00.000Z'
        '400': {$ref: '#/components/responses/BodyInvalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '409':
          description: >
            Uniqueness collision — the email or username is already taken in
            this org (`AUTH_EMAIL_TAKEN` / `AUTH_USERNAME_TAKEN`).
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example:
                error:
                  code: AUTH_EMAIL_TAKEN
                  message: email 'mary.wanjiku@mjengo.co.ke' is already registered in this org
                requestId: 9f2c1b3a-4d5e-4f60-8a71-2b3c4d5e6f70
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '500': {$ref: '#/components/responses/InternalError'}

  /v1/auth/roles/grants:
    post:
      tags: [Auth Admin]
      operationId: grantRole
      summary: Grant a role to a user (escalation-guarded).
      description: >
        Requires `admin:manage-users`. Idempotent by value: replaying an
        ACTIVE identical grant answers **200** with `alreadyHeld: true` and
        the existing grant (a replay is never a second fact). The escalation
        guard compares the granter's own CONCRETE effective permission set —
        a granter cannot confer authority they do not hold — and refuses with
        **403 `AUTH_ESCALATION_BLOCKED`** (refusal audited as
        `auth.escalationBlocked`). Unknown role/user → 404
        (`HTTP_ROLE_NOT_FOUND` / `HTTP_USER_NOT_FOUND`).
      x-required-permission: admin:manage-users
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GrantRoleBody'}
            example:
              userId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
              roleId: 2b7f4a10-1c22-4d3e-9a41-6f8b0c2d3e4f
      responses:
        '201':
          description: Grant created.
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GrantIssuedResponse'}
              example:
                data:
                  grant:
                    id: 5e6f7081-92a3-4b5c-8d6e-7f8091a2b3c4
                    orgId: 00000000-0000-4000-8000-000000000901
                    userId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                    roleId: 2b7f4a10-1c22-4d3e-9a41-6f8b0c2d3e4f
                    resourceId: null
                    grantedBy: 00000000-0000-4000-8000-000000000902
                    grantedAt: '2026-09-04T09:20:00.000Z'
                    revokedAt: null
                    revokedReason: null
                  alreadyHeld: false
        '200':
          description: >
            Idempotent replay — the user already actively holds an identical
            grant; the EXISTING grant is returned with `alreadyHeld: true`.
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GrantIssuedResponse'}
        '400': {$ref: '#/components/responses/BodyInvalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/EscalationBlocked'}
        '404':
          description: >
            The referenced role or user does not exist (`HTTP_ROLE_NOT_FOUND`
            / `HTTP_USER_NOT_FOUND`).
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example:
                error:
                  code: HTTP_ROLE_NOT_FOUND
                  message: role 2b7f4a10-1c22-4d3e-9a41-6f8b0c2d3e4f does not exist
                requestId: 9f2c1b3a-4d5e-4f60-8a71-2b3c4d5e6f70
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '500': {$ref: '#/components/responses/InternalError'}

  /v1/auth/roles/revocations:
    post:
      tags: [Auth Admin]
      operationId: revokeRole
      summary: Revoke a user's active role grant.
      description: >
        Requires `admin:manage-users`. Revocation is a FACT (no DELETE
        semantics over immutable facts): the active grant matching
        (userId, roleId, resourceId) is stamped `revokedAt`/`revokedReason`.
        Revoking a role the user does not actively hold refuses with 409
        `AUTH_ROLE_NOT_HELD`.
      x-required-permission: admin:manage-users
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RevokeRoleBody'}
            example:
              userId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
              roleId: 2b7f4a10-1c22-4d3e-9a41-6f8b0c2d3e4f
              reason: offboarded from the collections team
      responses:
        '200':
          description: The grant (now revoked) in its post-fact shape.
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GrantRevokedResponse'}
              example:
                data:
                  grant:
                    id: 5e6f7081-92a3-4b5c-8d6e-7f8091a2b3c4
                    orgId: 00000000-0000-4000-8000-000000000901
                    userId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                    roleId: 2b7f4a10-1c22-4d3e-9a41-6f8b0c2d3e4f
                    resourceId: null
                    grantedBy: 00000000-0000-4000-8000-000000000902
                    grantedAt: '2026-09-04T09:20:00.000Z'
                    revokedAt: '2026-09-05T07:00:00.000Z'
                    revokedReason: offboarded from the collections team
        '400': {$ref: '#/components/responses/BodyInvalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404':
          description: The referenced role does not exist (`HTTP_ROLE_NOT_FOUND`).
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: >
            The user does not actively hold this role in this scope
            (`AUTH_ROLE_NOT_HELD` — revoking an unheld role is refused).
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example:
                error:
                  code: AUTH_ROLE_NOT_HELD
                  message: user 7c9e6679-7425-40de-944b-e07fc1f90ae7 does not actively hold role 2b7f4a10-1c22-4d3e-9a41-6f8b0c2d3e4f in this scope — revoking an unheld role is refused
                requestId: 9f2c1b3a-4d5e-4f60-8a71-2b3c4d5e6f70
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '500': {$ref: '#/components/responses/InternalError'}

  /v1/auth/api-keys:
    post:
      tags: [Auth Admin]
      operationId: issueApiKey
      summary: Issue an API key (caller-supplied secret; prefix-only response).
      description: >
        Requires `admin:manage-users`. Secret discipline (SPEC §34): the
        caller SUPPLIES the secret in the request body (minimum 16 chars);
        the response carries the visible PREFIX (first 8 chars) plus scopes —
        neither the raw secret nor its hash is ever echoed, logged or stored.
        Scopes must be a non-empty array of CONCRETE permissions from the
        closed vocabulary (`AUTH_PERMISSION_UNKNOWN` /
        `AUTH_PERMISSION_WILDCARD_FORBIDDEN` → 400). Duplicate key id → 409
        `AUTH_KEY_ID_TAKEN`; prefix collision or stale expiry → 409
        `AUTH_KEY_PREFIX_TAKEN` / 400 `AUTH_KEY_EXPIRY_INVALID`.
      x-required-permission: admin:manage-users
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IssueKeyBody'}
            example:
              name: mjengoos-intake
              secret: fy-local-dev-secret-0001
              scopes: [payments:intake, payments:read]
              expiresAt: '2027-01-01T00:00:00.000Z'
      responses:
        '201':
          description: Key issued — prefix + scopes only, never secret material.
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KeyIssuedResponse'}
              example:
                data:
                  key:
                    id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                    orgId: 00000000-0000-4000-8000-000000000901
                    name: mjengoos-intake
                    prefix: fy-local
                    scopes: [payments:intake, payments:read]
                    expiresAt: '2027-01-01T00:00:00.000Z'
                    status: active
                    createdAt: '2026-09-04T09:30:00.000Z'
                    lastUsedAt: null
        '400': {$ref: '#/components/responses/BodyInvalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '409':
          description: >
            `AUTH_KEY_ID_TAKEN` (id already exists) or
            `AUTH_KEY_PREFIX_TAKEN` (another active key already shows the
            first 8 chars of this secret — generate a fresh secret).
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example:
                error:
                  code: AUTH_KEY_PREFIX_TAKEN
                  message: api-key prefix 'fy-local' is already in use — generate a fresh secret
                requestId: 9f2c1b3a-4d5e-4f60-8a71-2b3c4d5e6f70
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '500': {$ref: '#/components/responses/InternalError'}

  /v1/auth/api-keys/revocations:
    post:
      tags: [Auth Admin]
      operationId: revokeApiKey
      summary: Revoke an API key (idempotent).
      description: >
        Requires `admin:manage-users`. Revoking an already-revoked key is a
        no-op answered with the key and `alreadyRevoked: true` (revocation is
        a fact). Unknown key id → 404 `AUTH_KEY_NOT_FOUND`.
      x-required-permission: admin:manage-users
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RevokeKeyBody'}
            example:
              keyId: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
              reason: leaked in a bug report
      responses:
        '200':
          description: The key in its post-revocation shape.
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KeyRevokedResponse'}
              example:
                data:
                  key:
                    id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                    orgId: 00000000-0000-4000-8000-000000000901
                    name: mjengoos-intake
                    prefix: fy-local
                    scopes: [payments:intake, payments:read]
                    expiresAt: '2027-01-01T00:00:00.000Z'
                    status: revoked
                    createdAt: '2026-09-04T09:30:00.000Z'
                    lastUsedAt: '2026-09-04T11:00:00.000Z'
                  alreadyRevoked: false
        '400': {$ref: '#/components/responses/BodyInvalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404':
          description: No api key carries the presented id (`AUTH_KEY_NOT_FOUND`).
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example:
                error:
                  code: AUTH_KEY_NOT_FOUND
                  message: api key 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d does not exist
                requestId: 9f2c1b3a-4d5e-4f60-8a71-2b3c4d5e6f70
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '500': {$ref: '#/components/responses/InternalError'}

  /v1/auth/sessions/revocations:
    post:
      tags: [Auth Admin]
      operationId: revokeSession
      summary: Revoke a session (kill a live Bearer token).
      description: >
        Requires `admin:manage-users`. The session is stamped
        `status: revoked` + `endedAt`/`endedReason`; its Bearer token
        immediately refuses with 401 `SESSION_REVOKED`. Unknown session →
        404 `HTTP_SESSION_NOT_FOUND`.
      x-required-permission: admin:manage-users
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RevokeSessionBody'}
            example:
              sessionId: a1b2c3d4-e5f6-4789-8a0b-1c2d3e4f5a6b
              reason: user reported a stolen laptop
      responses:
        '200':
          description: The session in its post-revocation shape.
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionRevokedResponse'}
              example:
                data:
                  session:
                    id: a1b2c3d4-e5f6-4789-8a0b-1c2d3e4f5a6b
                    userId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                    orgId: 00000000-0000-4000-8000-000000000901
                    status: revoked
                    createdAt: '2026-09-04T08:00:00.000Z'
                    lastSeenAt: '2026-09-04T09:59:00.000Z'
                    endedAt: '2026-09-04T10:00:00.000Z'
                    endedReason: user reported a stolen laptop
        '400': {$ref: '#/components/responses/BodyInvalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404':
          description: The session does not exist (`HTTP_SESSION_NOT_FOUND`).
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example:
                error:
                  code: HTTP_SESSION_NOT_FOUND
                  message: session a1b2c3d4-e5f6-4789-8a0b-1c2d3e4f5a6b does not exist
                requestId: 9f2c1b3a-4d5e-4f60-8a71-2b3c4d5e6f70
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '500': {$ref: '#/components/responses/InternalError'}

  # ===========================================================================
  # /v1/receivables — routes/receivables.ts (permission: receivables:read)
  # ===========================================================================

  /v1/receivables:
    get:
      tags: [Receivables]
      operationId: listReceivables
      summary: List the receivable read model (paginated).
      description: >
        Requires `receivables:read`. Deterministic offset pagination over the
        reference store: the opaque `cursor` is the offset into the ordered
        list; `meta.pagination.total` is the full ordered length. Sort
        whitelist: `id`, `state`, `dueDate` (anything else → 400
        `HTTP_QUERY_INVALID`).
      x-required-permission: receivables:read
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/ReceivableSort'}
        - {$ref: '#/components/parameters/Order'}
      responses:
        '200':
          description: One page of receivable views.
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReceivableListResponse'}
              example:
                data:
                  receivables:
                    - id: 6b8c9d0e-1f2a-4b3c-8d4e-5f60718293a4
                      invoiceId: 0f1e2d3c-4b5a-4968-8776-6554433221ff
                      customerId: 11a2b3c4-d5e6-4789-8a0b-1c2d3e4f5a6b
                      currency: KES
                      original: {minor: 12500000, currency: KES}
                      applied: {minor: 5000000, currency: KES}
                      balance: {minor: 7500000, currency: KES}
                      state: partially_paid
                      overdue: true
                      openedAt: '2026-08-01T10:00:00.000Z'
                      dueDate: '2026-08-15T00:00:00.000Z'
                      settledAt: null
                      voidedAt: null
                      writeOff: null
                      uncollectibleReason: null
